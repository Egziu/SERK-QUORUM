# SERK QUORUM continuous integration.
# Build and test only: nothing here deploys or publishes. Actions are pinned
# to full commit SHAs; update them deliberately.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QUORUM_TEST_DATABASE_URL: postgres://quorum_owner:quorum_owner_dev@127.0.0.1:5432/postgres

jobs:
  rust:
    name: Rust (fmt, clippy, tests, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Database roles
        run: PGPASSWORD=ci-superuser-password psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/bootstrap-db.sql
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Dependency vulnerability audit
        run: |
          cargo install cargo-audit --locked --version 0.23.0
          cargo audit

  web:
    name: Web (typecheck, tests, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  acceptance:
    name: Browser acceptance (Playwright + axe-core)
    needs: [rust, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Database
        run: PGPASSWORD=ci-superuser-password psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f scripts/bootstrap-db.sql
      - name: Build API and web client
        run: |
          cargo build --locked -p quorum-api
          cd apps/web && npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Migrate (owner role)
        run: ./target/debug/quorum-api migrate
        env:
          QUORUM_MIGRATION_DATABASE_URL: postgres://quorum_owner:quorum_owner_dev@127.0.0.1:5432/quorum_dev
      - name: Start API (application role, synthetic data only)
        run: |
          ./target/debug/quorum-api serve > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/health/ready && exit 0; sleep 1; done
          cat api.log; exit 1
        env:
          DATABASE_URL: postgres://quorum_api:quorum_api_dev@127.0.0.1:5432/quorum_dev
          QUORUM_ALLOW_SIGNUP: "1"
          QUORUM_COOKIE_SECURE: "0"
          QUORUM_WEB_DIR: apps/web/dist
      - name: Acceptance test
        working-directory: apps/web
        run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-screenshots
          path: apps/web/test-results/screenshots
          retention-days: 14

  legacy:
    name: Legacy v0.1 Node preview
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: legacy/v0.1-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm run check
